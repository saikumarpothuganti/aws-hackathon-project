<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudShop - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html">CloudShop</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <div class="login-container">
            <h2>Login</h2>
            <p class="demo-notice">DEMO AUTHENTICATION: Use test@example.com / Test@123</p>
            
            <div id="login-error" class="alert error"></div>
            <div id="login-success" class="alert success"></div>

            <form>
                <label for="email">Email</label>
                <input type="email" id="email" aria-label="Email Address">
                
                <label for="password">Password</label>
                <input type="password" id="password" aria-label="Password">
                
                <button id="login-btn" type="submit">Login</button>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 CloudShop Demo.</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
